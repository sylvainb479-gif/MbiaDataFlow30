name: Compiler 1 APK Android

on:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Telecharger le depot
        uses: actions/checkout@v4

      - name: Configurer Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Compiler 1 APK Debug
        run: |
          cd extracted_files/MbiaDataFlow
          gradle assembleDebug

      - name: Sauvegarder 1 APK comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: extracted_files/MbiaDataFlow/app/build/outputs/apk/debug/app-debug.apk
          
